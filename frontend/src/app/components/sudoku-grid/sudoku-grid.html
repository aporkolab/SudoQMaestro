@if (grid) {
  <div class="sudoku-board">
    @for (row of grid; track $index; let i = $index) {
      <div class="sudoku-row">
        @for (cell of row; track $index; let j = $index) {
          <div
            class="sudoku-cell"
            [class.border-right]="(j + 1) % 3 === 0 && j < 8"
            [class.border-bottom]="(i + 1) % 3 === 0 && i < 8"
          >
            <input
              type="number"
              class="cell-input"
              [value]="cell !== 0 ? cell : ''"
              [attr.readonly]="readonly || (cell !== 0 && cell !== null) ? true : null"
              min="1"
              max="9"
            />
          </div>
        }
      </div>
    }
  </div>
}
@if (!grid) {
  <div class="loading-grid">
    <p>Generating new puzzle...</p>
  </div>
}
